<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cetak Skor</title>
<link rel="icon" href="icons/icon-192.png">
<style>
  :root{--ink:#111;--mut:#555;--line:#999;--acc:#c77700}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#d9dde3;color:var(--ink)}
  /* ---------- panel kontrol (tidak ikut tercetak) ---------- */
  .bar{position:sticky;top:0;z-index:5;background:#0f1724;color:#eef2f7;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .bar h1{font-size:17px;margin:0 12px 0 0}
  [hidden]{display:none!important}
  .bar label{font-size:13px;display:flex;align-items:center;gap:6px}
  .bar select{padding:8px;border-radius:8px;border:1px solid #2a3a50;background:#17212f;color:#eef2f7;font-size:14px;max-width:220px}
  .seg{display:flex;background:#17212f;border-radius:10px;padding:3px}
  .seg button{border:0;background:transparent;color:#8b98ab;padding:8px 12px;border-radius:8px;font-weight:600;font-size:14px}
  .seg button.on{background:#f5a524;color:#111}
  .btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;font-size:14px;background:#2a3a50;color:#eef2f7}
  .btn.pri{background:#f5a524;color:#111}
  .info{width:100%;font-size:12px;color:#8b98ab}
  #status{padding:24px;text-align:center;color:#333}

  /* ---------- lembar A4 di layar ---------- */
  .page{background:#fff;width:210mm;min-height:297mm;margin:12px auto;padding:10mm;box-shadow:0 2px 10px rgba(0,0,0,.2)}
  @media (max-width:820px){ .page{width:100%;min-height:0;padding:4mm} }

  /* ---------- scoresheet per bantalan: A4 landscape, 1 kolom per pemanah ---------- */
  body.land .page{width:297mm;min-height:210mm}
  .sh-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4mm}
  .sh-head .ev{font-size:14pt;font-weight:800}
  .sh-head .sub{font-size:8.5pt;color:var(--mut);line-height:1.35}
  .sh-head .tg{text-align:right;font-size:8pt;color:var(--mut)}
  .sh-head .tg b{display:block;font-size:20pt;color:var(--ink);line-height:1}
  .cols{display:flex;gap:5mm;align-items:flex-start}
  .col{flex:0 0 calc((100% - 15mm) / var(--n));min-width:0}
  .ah{display:grid;grid-template-columns:1fr auto;border-bottom:1px solid var(--ink);margin-bottom:1mm}
  .ah .nm{font-size:10.5pt;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-top:1mm}
  .ah .nm small{font-weight:400;font-size:6.5pt;color:var(--mut);margin-right:1.5mm}
  .ah .cl{font-size:7pt;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:.8mm 0 1mm;border-top:1px solid #bbb}
  .ah .cl small{color:var(--mut);margin-right:1.5mm}
  .ah .pos{grid-row:1/3;grid-column:2;text-align:right;padding-left:2mm;border-left:1px solid #bbb;min-width:15mm}
  .ah .pos b{display:block;font-size:17pt;line-height:1.1}
  .ah .pos span{display:block;font-size:7.5pt;font-weight:700;background:#eee;text-align:center;padding:.4mm 1mm}
  table.ss{border-collapse:collapse;width:100%;table-layout:fixed;font-size:9pt}
  table.ss th,table.ss td{border:1px solid #444;text-align:center;padding:0;height:7.8mm}
  table.ss thead th{background:#ececec;font-size:8pt}
  table.ss thead tr.t1 th{height:5mm}
  table.ss thead tr.t2 th{height:4mm;font-size:6.5pt}
  table.ss th.cap{font-size:6.5pt;font-weight:700}
  table.ss td.en{background:#ececec;font-weight:800;font-size:10pt}
  table.ss td.sm{font-weight:600}
  table.ss td.x{background:linear-gradient(to top right,transparent calc(50% - .5px),#888 50%,transparent calc(50% + .5px)),linear-gradient(to bottom right,transparent calc(50% - .5px),#888 50%,transparent calc(50% + .5px))}
  table.ss td.et{font-weight:700}
  table.ss td.ck{font-weight:800;background:#f6f6f6}
  table.ss tr.endb td{border-bottom:1.6px solid var(--ink)}
  table.ss tr.ft td{border:1.4px solid var(--ink);height:7.5mm;font-weight:800;font-size:10.5pt}
  table.ss tr.ft td.lbl{border:0;text-align:right;padding-right:2mm;font-size:10pt}
  .sg{display:grid;grid-template-columns:1fr 1fr;gap:5mm;margin-top:14mm;font-size:7pt;font-style:italic;font-weight:700;text-align:center}
  .sg div{border-top:1px solid var(--ink);padding-top:.8mm}
  .foot{margin-top:6mm;font-size:7pt;color:var(--mut);display:flex;justify-content:space-between}

  /* ---------- hasil per kategori ---------- */
  .rh{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--ink);padding-bottom:3mm;margin-bottom:4mm}
  .rh .ev{font-size:15pt;font-weight:800}
  .rh .sub{font-size:9pt;color:var(--mut)}
  .rh .kat{text-align:right;font-size:9pt;color:var(--mut)}
  .rh .kat b{display:block;font-size:15pt;color:var(--ink)}
  table.rs{width:100%;border-collapse:collapse;font-size:10pt}
  table.rs th{background:#111;color:#fff;font-size:8pt;font-weight:600;padding:2mm 1.5mm;text-transform:uppercase}
  table.rs td{border-bottom:1px solid #ccc;padding:1.8mm 1.5mm;text-align:center}
  table.rs td.l,table.rs th.l{text-align:left}
  table.rs td.t{font-weight:800}
  table.rs tr:nth-child(even) td{background:#f6f6f6}
  .rnote{font-size:8pt;color:var(--mut);margin-top:3mm}
  .rsign{display:grid;grid-template-columns:1fr 1fr;gap:20mm;margin-top:14mm;font-size:9pt;text-align:center}
  .rsign div{border-top:1px solid var(--ink);padding-top:1.5mm;margin-top:16mm}
  .rpage + .rpage.brk{page-break-before:always;break-before:page}
  .rpage + .rpage:not(.brk){margin-top:10mm}

  /* ---------- scoresheet eliminasi: 2 pertandingan per A4 portrait ---------- */
  .em{height:134mm;border:1.4px solid var(--ink);padding:3mm 4mm;display:flex;flex-direction:column;page-break-inside:avoid;break-inside:avoid}
  .em + .em{margin-top:6mm}
  .em-h{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1.6px solid var(--ink);padding-bottom:1.5mm;margin-bottom:2mm}
  .em-h .ev{font-size:11pt;font-weight:800} .em-h .sub{font-size:7.5pt;color:var(--mut)}
  .em-h .kt{text-align:right;font-size:8pt} .em-h .kt b{display:block;font-size:12pt}
  .em-c{display:grid;grid-template-columns:1fr 1fr;gap:5mm;flex:1}
  .em-p{border:1px solid #888;padding:1.2mm 2mm;margin-bottom:1.5mm;min-height:11mm}
  .em-p b{font-size:10pt;display:block} .em-p small{font-size:7pt;color:var(--mut)} .em-p .sd{float:right;font-size:8pt;font-weight:700}
  table.es{width:100%;border-collapse:collapse;table-layout:fixed;font-size:9pt}
  table.es th,table.es td{border:1px solid #444;text-align:center;height:7.2mm;padding:0}
  table.es th{background:#ececec;font-size:6.8pt;height:4.5mm}
  table.es td.n{background:#ececec;font-weight:800}
  table.es td.t{font-weight:700} table.es td.pt{font-weight:800;background:#f6f6f6}
  table.es tr.so td{height:6.5mm}
  table.es tr.tot td{border:1.4px solid var(--ink);font-weight:800;font-size:10.5pt}
  table.es td.lb{border:0;text-align:right;padding-right:1.5mm;font-size:8pt;background:none}
  .em .win{margin-top:1.5mm;font-size:8.5pt;border:1px solid #888;padding:1mm 2mm}
  .em .sg{margin-top:auto;padding-top:8mm}
  .em .sg div{font-size:6.5pt}

  /* ---------- saat dicetak ---------- */
  @media print{
    body{background:#fff}
    .noprint{display:none!important}
    .page,body.land .page{width:auto;min-height:0;margin:0;padding:0;box-shadow:none}
    .page + .page{page-break-before:always;break-before:page}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>
</head>
<body>
<div class="bar noprint">
  <h1>Cetak Skor</h1>
  <div class="seg" id="mode">
    <button data-m="kartu" class="on">Scoresheet</button>
    <button data-m="hasil">Hasil Kualifikasi</button>
    <button data-m="ess">Scoresheet Eliminasi</button>
    <button data-m="elim">Hasil Eliminasi</button>
  </div>
  <label id="lKat" hidden>Kategori <select id="fKat"><option value="">Semua</option></select></label>
  <label id="lSesi">Sesi <select id="fSesi"></select></label>
  <label id="lGel" hidden>Gelombang <select id="fGel"><option value="">Semua</option></select></label>
  <label id="lBant">Bantalan <select id="fBant"><option value="">Semua</option></select></label>
  <label id="lBabak" hidden>Babak <select id="fBabak"><option value="">Semua</option></select></label>
  <label id="lKosong"><input type="checkbox" id="fKosong"> Kartu kosong</label>
  <label id="lBrk" hidden><input type="checkbox" id="fBrk" checked> 1 kategori per halaman</label>
  <button class="btn" id="btnMuat">↻ Muat ulang</button>
  <button class="btn pri" id="btnCetak">🖨 Cetak / Simpan PDF</button>
  <div class="info">Simpan sebagai PDF: klik Cetak → pilih printer <b>"Simpan sebagai PDF"</b>. Di HP Android: Chrome ⋮ → Bagikan → Cetak. Kertas A4 (scoresheet otomatis landscape).</div>
</div>
<style id="pg">@page{size:A4 landscape;margin:8mm}</style>
<div id="status" class="noprint">Memuat data…</div>
<div id="out"></div>

<script src="admin-auth.js"></script>
<script>
/* ===== ISI SEKALI: URL Web App Apps Script (berakhiran /exec) ===== */
var API_URL = 'https://script.google.com/macros/s/AKfycbyOXg2x1ZjDrRZiev1Sw_JKZH9I_sWTyGOvYBtOso2BQ6Dt1V5BcDai7ATMCZOYecgF6Q/exec';
/* ================================================================== */
var MODE = 'kartu', KARTU = null, HASIL = null, ELIM = null;
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function val(a){ return a === 'X' ? 10 : a === 'M' ? 0 : Number(a) || 0; }
function apiUrl(){
  var q = new URLSearchParams(location.search).get('api');
  if (q) return q;
  if (/^https:\/\/script\.google/.test(API_URL)) return API_URL;
  try { var c = JSON.parse(localStorage.getItem('cfg') || '{}'); if (c.api) return c.api; } catch(e){}
  return '';
}
function ambil(action){
  return fetch(apiUrl() + '?action=' + action + (action === 'kartu' ? '&pin=' + encodeURIComponent(AdminAuth.get()) : ''), {redirect:'follow'}).then(function(r){ return r.json(); })
    .then(function(j){ if (!j.ok) throw new Error(j.error || 'Gagal'); return j; });
}
function waktuCetak(){ return new Date().toLocaleString('id-ID', {dateStyle:'medium', timeStyle:'short'}); }

/* ---------- memuat data ---------- */
function muat(){
  if (!apiUrl()) { $('status').textContent = 'URL Web App belum diisi di cetak.html (baris API_URL).'; return; }
  $('status').hidden = false; $('status').textContent = 'Memuat data…';
  Promise.all([ambil('kartu'), ambil('hasil'), ambil('eliminasi').catch(function(){ return null; })]).then(function(r){
    KARTU = r[0]; HASIL = r[1]; ELIM = r[2];
    isiFilter(); render();
    $('status').hidden = true;
  }).catch(function(e){ $('status').textContent = 'Gagal memuat: ' + e.message; });
}
function isiFilter(){
  var kat = $('fKat').value, ban = $('fBant').value;
  var fs = $('fSesi').value, so = '<option value="">Semua sesi</option>';
  for (var s = 1; s <= KARTU.jumlahSesi; s++) so += '<option value="' + s + '">Sesi ' + s + '</option>';
  $('fSesi').innerHTML = so; $('fSesi').value = fs;
  var kats = MODE === 'elim' || MODE === 'ess' ? (ELIM ? ELIM.kategori.filter(function(k){ return k.punyaBracket; }).map(function(k){ return k.kategori; }) : [])
                             : HASIL.data.map(function(k){ return k.kategori; });
  $('fKat').innerHTML = '<option value="">Semua</option>' + kats.map(function(k){ return '<option>' + esc(k) + '</option>'; }).join('');
  var gel = $('fGel').value, gels = [];
  KARTU.data.forEach(function(p){ if (p.gelombang && gels.indexOf(p.gelombang) < 0) gels.push(p.gelombang); });
  $('fGel').innerHTML = '<option value="">Semua</option>' + gels.map(function(g){ return '<option>' + esc(g) + '</option>'; }).join('');
  $('fGel').value = gels.indexOf(gel) >= 0 ? gel : '';
  var bans = []; KARTU.data.forEach(function(p){ if (bans.indexOf(p.bantalan) < 0) bans.push(p.bantalan); });
  bans.sort(function(a, b){ return Number(a) - Number(b) || String(a).localeCompare(b); });
  $('fBant').innerHTML = '<option value="">Semua</option>' + bans.map(function(b){ return '<option>' + esc(b) + '</option>'; }).join('');
  $('fKat').value = kats.indexOf(kat) >= 0 ? kat : '';
  $('fBant').value = bans.indexOf(ban) >= 0 ? ban : '';
}

/* ---------- scoresheet kualifikasi: 1 lembar A4 landscape per bantalan per sesi ---------- */
var KODE_DIV = { RECURVE: 'R', COMPOUND: 'C', NASIONAL: 'N', BAREBOW: 'B' };
function kodeKat(p){ return [KODE_DIV[p.divisi] || p.divisi, p.ku, p.gender].filter(Boolean).join(' '); }
function kolomPemanah(p, cfg, sesi, kosong){
  var n = cfg.panahPerEnd, per = Math.ceil(n / 2), eps = cfg.endPerSesi;
  var head = '<thead><tr class="t1"><th rowspan="2" style="width:9%"></th>';
  for (var k = 1; k <= per; k++) head += '<th rowspan="2">' + k + '</th>';
  head += '<th colspan="5" class="cap">' + esc(cfg.jumlahSesi > 1 ? 'Kualifikasi · Sesi ' + sesi : 'Kualifikasi') + '</th></tr>' +
          '<tr class="t2"><th>Sum</th><th colspan="2">Tot.</th><th style="width:9%">10+X</th><th style="width:8%">X</th></tr></thead>';
  var body = '', kum = 0, tx = 0, t10 = 0, ada = false;
  for (var e = 1; e <= eps; e++) {
    var en = (sesi - 1) * eps + e;
    var a = !kosong && p.skor && p.skor[en] ? p.skor[en].arrows : [];
    var r1 = a.slice(0, per), r2 = a.slice(per, n);
    var s1 = 0, s2 = 0, x = 0, s10 = 0;
    r1.forEach(function(v){ s1 += val(v); }); r2.forEach(function(v){ s2 += val(v); });
    a.forEach(function(v){ if (v === 'X') x++; if (v === 'X' || v === '10') s10++; });
    var isi = a.length > 0;
    if (isi) { ada = true; kum += s1 + s2; tx += x; t10 += s10; }
    var c1 = '', c2 = '';
    for (var i = 0; i < per; i++) { c1 += '<td>' + esc(r1[i] || '') + '</td>'; c2 += '<td>' + esc(r2[i] || '') + '</td>'; }
    body += '<tr><td class="en" rowspan="2">' + e + '</td>' + c1 + '<td class="sm">' + (r1.length ? s1 : '') + '</td>' +
            '<td class="x" colspan="2"></td><td rowspan="2">' + (isi ? s10 : '') + '</td><td rowspan="2">' + (isi ? x : '') + '</td></tr>' +
            '<tr class="endb">' + c2 + '<td class="sm">' + (r2.length ? s2 : '') + '</td>' +
            '<td class="et">' + (isi ? s1 + s2 : '') + '</td><td class="ck">' + (isi ? kum : '') + '</td></tr>';
  }
  body += '<tr class="ft"><td class="lbl" colspan="' + (per + 2) + '">Total</td><td colspan="2">' + (ada ? kum : '') + '</td><td>' + (ada ? t10 : '') + '</td><td>' + (ada ? tx : '') + '</td></tr>';
  return '<div class="col"><div class="ah">' +
      '<div class="nm"><small>Pemanah:</small>' + esc(p.nama) + '</div>' +
      '<div class="pos"><b>' + esc(p.bantalan + p.posisi) + '</b><span>' + esc(kodeKat(p)) + '</span></div>' +
      '<div class="cl"><small>Klub:</small>' + esc(p.klub || '-') + '</div></div>' +
    '<table class="ss">' + head + '<tbody>' + body + '</tbody></table>' +
    '<div class="sg"><div>Pemanah</div><div>Pencatat Skor</div></div></div>';
}
function lembarBantalan(list, cfg, sesi, kosong){
  var n = Math.max(3, list.length);
  return '<div class="page"><div class="sh-head"><div><div class="ev">' + esc(cfg.namaLomba) + '</div>' +
      '<div class="sub">' + [cfg.penyelenggara, cfg.tempatTanggal].filter(Boolean).map(esc).join('<br>') + '</div></div>' +
      '<div class="tg">Bantalan<b>' + esc(list[0].bantalan) + '</b>' + [list[0].gelombang ? esc(list[0].gelombang) : '', cfg.jumlahSesi > 1 ? 'Sesi ' + sesi : ''].filter(Boolean).join(' · ') + '</div></div>' +
    '<div class="cols" style="--n:' + n + '">' + list.map(function(p){ return kolomPemanah(p, cfg, sesi, kosong); }).join('') + '</div>' +
    '<div class="foot"><span>Face 10-ring: X,10–1,M · Face 6-ring (Compound/Nasional): X,10–5,M · X dihitung 10</span><span>Dicetak ' + waktuCetak() + '</span></div></div>';
}
function renderKartu(){
  var ban = $('fBant').value, kosong = $('fKosong').checked, fs = $('fSesi').value;
  var sesiList = []; for (var s = 1; s <= KARTU.jumlahSesi; s++) if (!fs || String(s) === fs) sesiList.push(s);
  var grup = {}, urut = [];
  var gel = $('fGel').value;
  KARTU.data.forEach(function(p){
    if (ban && p.bantalan !== ban) return; if (gel && (p.gelombang || '') !== gel) return;
    var k = (p.gelombang || '') + '|' + p.bantalan;
    if (!grup[k]) { grup[k] = []; urut.push(k); } grup[k].push(p);
  });
  if (!urut.length) return '<div class="page"><p>Tidak ada pemanah untuk filter ini.</p></div>';
  var html = '';
  urut.forEach(function(b){
    var list = grup[b].slice(0, 4); // maksimal 4 pemanah (A–D) per lembar
    sesiList.forEach(function(s){ html += lembarBantalan(list, KARTU, s, kosong); });
  });
  return html;
}

/* ---------- hasil per kategori ---------- */
function renderHasil(){
  var kat = $('fKat').value, brk = $('fBrk').checked, nS = HASIL.jumlahSesi;
  var fs = Number($('fSesi').value) || 0, gel = $('fGel').value, eps = KARTU.endPerSesi;
  var info = {}; KARTU.data.forEach(function(p){ info[p.id] = p; });
  var sesiStat = function(p, s){   // total, 10+X, X untuk satu sesi dari data per rambahan
    if (p.tim) { var o = { total: 0, sepuluh: 0, x: 0 }; (p.anggota || []).forEach(function(id){ var q = sesiStat({ id: id }, s); o.total += q.total; o.sepuluh += q.sepuluh; o.x += q.x; }); return o; }
    var k = info[p.id], t = 0, sp = 0, x = 0;
    for (var e = (s - 1) * eps + 1; e <= s * eps; e++) { var en = k && k.skor && k.skor[e]; if (en) { t += Number(en.total) || 0; sp += Number(en.sepuluh) || 0; x += Number(en.x) || 0; } }
    return { total: t, sepuluh: sp, x: x };
  };
  var grp = HASIL.data.filter(function(k){ return !kat || k.kategori === kat; }).map(function(g){
    var list = g.peserta.filter(function(p){ return !gel || ((info[p.tim ? (p.anggota || [])[0] : p.id] || {}).gelombang || '') === gel; }).map(function(p){
      var st = fs ? sesiStat(p, fs) : { total: p.total, sepuluh: p.sepuluh, x: p.x };
      return { p: p, total: st.total, sepuluh: st.sepuluh, x: st.x };
    });
    list.sort(function(a, b){ return b.total - a.total || b.sepuluh - a.sepuluh || b.x - a.x || a.p.nama.localeCompare(b.p.nama); });
    list.forEach(function(r, i){ var pv = list[i - 1]; r.rank = pv && pv.total === r.total && pv.sepuluh === r.sepuluh && pv.x === r.x ? pv.rank : i + 1; });
    return { kategori: g.kategori, list: list, tim: g.tim };
  }).filter(function(g){ return g.list.length; });
  if (!grp.length) return '<div class="page"><p>Tidak ada data untuk filter ini.</p></div>';
  var judul = 'Hasil Kualifikasi' + (fs && nS > 1 ? ' · Sesi ' + fs : '') + (gel ? ' · Gelombang ' + esc(gel) : '');
  var body = grp.map(function(g, gi){
    var head = '<tr><th>#</th><th class="l">' + (g.tim ? 'Tim' : 'Nama') + '</th><th class="l">' + (g.tim ? 'Anggota' : 'Klub') + '</th><th>' + (g.tim ? '' : 'Bant.') + '</th>';
    if (fs) head += '<th>' + (nS > 1 ? 'Sesi ' + fs : 'Skor') + '</th>';
    else { for (var s = 1; s <= nS; s++) head += '<th>' + (nS > 1 ? 'Sesi ' + s : 'Skor') + '</th>'; head += '<th>Total</th>'; }
    head += '<th>10+X</th><th>X</th></tr>';
    var rows = g.list.map(function(r){
      var p = r.p, cols = fs ? '<td class="t">' + r.total + '</td>'
        : p.sesi.map(function(v){ return '<td>' + (v === null ? '–' : v) + '</td>'; }).join('') + '<td class="t">' + r.total + '</td>';
      return '<tr><td class="t">' + r.rank + '</td><td class="l">' + esc(p.nama) + '</td><td class="l">' + esc(p.klub) + '</td><td>' + esc(p.bantalan) + '</td>' + cols + '<td>' + r.sepuluh + '</td><td>' + r.x + '</td></tr>';
    }).join('');
    return '<section class="rpage' + (brk && gi > 0 ? ' brk' : '') + '">' +
      '<div class="rh"><div><div class="ev">' + esc(HASIL.namaLomba) + '</div><div class="sub">' + judul + ' · dicetak ' + waktuCetak() + '</div></div>' +
      '<div class="kat">Kategori<b>' + esc(g.kategori) + '</b></div></div>' +
      '<table class="rs"><thead>' + head + '</thead><tbody>' + rows + '</tbody></table>' +
      '<div class="rnote">Penentu peringkat: ' + (fs ? 'skor Sesi ' + fs : 'Total') + ' → jumlah 10+X → jumlah X. Peringkat sama = hasil identik.' +
      (fs || gel ? ' Peringkat dihitung di antara peserta yang tercetak.' : '') + '</div>' +
    '</section>';
  }).join('');
  return '<div class="page">' + body + '</div>';
}

/* ---------- scoresheet eliminasi ---------- */
var F_IND = { ends: 5, arrows: 3, setWin: 6, soN: 1 };
function nilaiE(v){ return v === 'X' ? 10 : v === 'M' || !v ? 0 : Number(v) || 0; }
function soArr(v){ return String(v == null ? '' : v).split(',').map(function(x){ return x.trim(); }).filter(Boolean); }
function lembarMatch(m, k, kosong){
  var f = k.format || F_IND, set = k.sistem !== 'KUMULATIF', tim = f.arrows !== 3;
  var sa = kosong ? [] : (m.skorA || []), sb = kosong ? [] : (m.skorB || []);
  // poin per rambahan (sistem set) atau kumulatif
  var pa = 0, pb = 0, ca = 0, cb = 0, info = [];
  for (var i = 0; i < f.ends; i++) {
    var a = sa[i] || [], b = sb[i] || [], ta = a.reduce(function(t, v){ return t + nilaiE(v); }, 0), tb = b.reduce(function(t, v){ return t + nilaiE(v); }, 0);
    var lengkap = a.length >= f.arrows && b.length >= f.arrows, selesai = set && (pa >= f.setWin || pb >= f.setWin);
    var r = { a: a, b: b, ta: a.length ? ta : '', tb: b.length ? tb : '', pa: '', pb: '' };
    if (lengkap && !selesai) {
      ca += ta; cb += tb;
      if (set) { var p = ta > tb ? [2, 0] : tb > ta ? [0, 2] : [1, 1]; pa += p[0]; pb += p[1]; r.pa = p[0]; r.pb = p[1]; }
      else { r.pa = ca; r.pb = cb; }
    }
    info.push(r);
  }
  var soA = kosong ? [] : soArr(m.soA), soB = kosong ? [] : soArr(m.soB);
  var kolom = function(sisi){
    var o = sisi === 'A' ? m.a : m.b, w = !kosong && m.pemenang === sisi;
    var head = '<tr><th style="width:7mm">' + (set ? 'Set' : 'Rmb') + '</th>';
    for (var q = 1; q <= f.arrows; q++) head += '<th>' + q + '</th>';
    head += '<th style="width:10mm">Jml</th><th style="width:10mm">' + (set ? 'Poin' : 'Kum.') + '</th></tr>';
    var body = info.map(function(r, i){
      var arr = sisi === 'A' ? r.a : r.b, c = '';
      for (var q = 0; q < f.arrows; q++) c += '<td>' + esc(arr[q] || '') + '</td>';
      return '<tr><td class="n">' + (i + 1) + '</td>' + c + '<td class="t">' + (sisi === 'A' ? r.ta : r.tb) + '</td><td class="pt">' + (sisi === 'A' ? r.pa : r.pb) + '</td></tr>';
    }).join('');
    var so = sisi === 'A' ? soA : soB, sc = '';
    for (var q2 = 0; q2 < f.arrows; q2++) sc += q2 < f.soN ? '<td>' + esc(so[q2] || '') + '</td>' : '<td style="border:0"></td>';
    var soT = so.length ? so.reduce(function(t, v){ return t + nilaiE(v); }, 0) : '';
    var closer = !kosong && m.soCloser === sisi ? ' ●' : '';
    var akhir = kosong ? '' : (set ? (sisi === 'A' ? m.poinA : m.poinB) : (sisi === 'A' ? ca : cb));
    if (!kosong && !((m.skorA && m.skorA.length) || (m.skorB && m.skorB.length))) akhir = '';
    return '<div><div class="em-p"><span class="sd">' + (o && o.seed ? 'Seed ' + esc(o.seed) : '') + '</span><b>' + (o ? esc(o.nama) : '&nbsp;') + (w ? ' ✓' : '') + '</b><small>' + (o ? esc(o.klub) : (tim ? 'Tim' : 'Pemanah') + ' ' + sisi) + '</small></div>' +
      '<table class="es"><thead>' + head + '</thead><tbody>' + body +
      '<tr class="so"><td class="n" style="font-size:6.5pt">SO</td>' + sc + '<td class="t">' + soT + closer + '</td><td style="border:0"></td></tr>' +
      '<tr class="tot"><td class="lb" colspan="' + (f.arrows + 1) + '">' + (set ? 'Total poin set' : 'Total skor') + '</td><td colspan="2">' + akhir + '</td></tr>' +
      '</tbody></table>' +
      '<div class="sg"><div>' + (tim ? 'Kapten Tim' : 'Pemanah') + '</div><div>Pencatat Skor</div></div></div>';
  };
  var pemenang = !kosong && m.pemenang ? (m.pemenang === 'A' ? m.a : m.b) : null;
  return '<div class="em"><div class="em-h"><div><div class="ev">' + esc(ELIM.namaLomba) + '</div><div class="sub">Scoresheet Eliminasi · ' +
      (tim ? (f.arrows === 6 ? 'Beregu' : 'Mix Team') + ' · ' : '') + f.ends + ' rambahan × ' + f.arrows + ' anak panah · ' + (set ? 'sistem set (menang ' + f.setWin + ' poin)' : 'sistem kumulatif') + '</div></div>' +
      '<div class="kt">' + esc(k.kategori) + '<b>' + esc(m.babak === 'Perunggu' ? 'Perebutan Juara 3' : m.babak) + (m.ukuran > 1 ? ' #' + m.no : '') + (m.bantalan ? ' · Bantalan ' + esc(m.bantalan) : ' · Bantalan ____') + '</b></div></div>' +
    '<div class="em-c">' + kolom('A') + kolom('B') + '</div>' +
    '<div class="win">Pemenang: <b>' + (pemenang ? esc(pemenang.nama) : '') + '</b>' + (f.soN ? '&nbsp;&nbsp;&nbsp;<span style="color:#555">SO ' + f.soN + ' anak panah · ● = paling dekat ke tengah</span>' : '') + '</div></div>';
}
function renderESS(){
  if (!ELIM) return '<div class="page"><p>Data eliminasi tidak bisa dimuat.</p></div>';
  var kat = $('fKat').value, bb = $('fBabak').value, kosong = $('fKosong').checked;
  var kats = {}; ELIM.kategori.forEach(function(k){ kats[k.kategori] = k; });
  var urut = function(m){ return m.ukuran === 1 ? 1.5 : m.ukuran; };
  var list = ELIM.matches.filter(function(m){
    if (kat && m.kategori !== kat) return false;
    if (bb && m.babak !== bb) return false;
    if (m.pemenang && (!m.a || !m.b)) return false;            // bye
    return kosong || (m.a && m.b);                              // kartu kosong: semua pertandingan
  }).sort(function(x, y){ return x.kategori.localeCompare(y.kategori) || urut(y) - urut(x) || x.no - y.no; });
  if (!list.length) return '<div class="page"><p>Tidak ada pertandingan untuk filter ini' + (kosong ? '' : ' (centang Kartu kosong untuk mencetak pertandingan yang pesertanya belum ditentukan)') + '.</p></div>';
  var html = '';
  for (var i = 0; i < list.length; i += 2) {
    html += '<div class="page">' + lembarMatch(list[i], kats[list[i].kategori] || {}, kosong) + (list[i + 1] ? lembarMatch(list[i + 1], kats[list[i + 1].kategori] || {}, kosong) : '') + '</div>';
  }
  return html;
}
function isiBabak(){
  if (!ELIM) return;
  var v = $('fBabak').value, kat = $('fKat').value, ada = [];
  ['1/32','1/16','1/8','1/4','Semifinal','Perunggu','Final'].forEach(function(b){
    if (ELIM.matches.some(function(m){ return m.babak === b && (!kat || m.kategori === kat); })) ada.push(b);
  });
  $('fBabak').innerHTML = '<option value="">Semua</option>' + ada.map(function(b){ return '<option value="' + b + '">' + (b === 'Perunggu' ? 'Perebutan Juara 3' : b) + '</option>'; }).join('');
  $('fBabak').value = ada.indexOf(v) >= 0 ? v : '';
}

/* ---------- hasil eliminasi per kategori ---------- */
function peringkatElim(ms){
  var orang = {}, urutan = [];
  ms.forEach(function(m){ [m.a, m.b].forEach(function(o){ if (o && !orang[o.id]) { orang[o.id] = { o: o, rank: null, ket: 'Masih bertanding' }; urutan.push(o.id); } }); });
  ms.forEach(function(m){
    if (!m.pemenang || !m.a || !m.b) return;
    var w = m.pemenang === 'A' ? m.a : m.b, l = m.pemenang === 'A' ? m.b : m.a;
    if (m.ukuran === 2) { orang[w.id].rank = 1; orang[w.id].ket = 'Juara 1'; orang[l.id].rank = 2; orang[l.id].ket = 'Juara 2'; }
    else if (m.ukuran === 1) { orang[w.id].rank = 3; orang[w.id].ket = 'Juara 3'; orang[l.id].rank = 4; orang[l.id].ket = 'Peringkat 4'; }
    else if (m.ukuran > 4) { orang[l.id].rank = m.ukuran / 2 + 1; orang[l.id].ket = 'Kalah di babak ' + m.babak; }
    else if (m.ukuran === 4 && orang[l.id].rank === null) orang[l.id].ket = 'Ke perebutan juara 3';
  });
  return urutan.map(function(id){ return orang[id]; }).sort(function(x, y){
    return (x.rank || 999) - (y.rank || 999) || (Number(x.o.seed) || 0) - (Number(y.o.seed) || 0);
  });
}
function renderElim(){
  if (!ELIM) return '<div class="page"><p>Data eliminasi tidak bisa dimuat. Pastikan Code.gs versi terbaru sudah diterapkan.</p></div>';
  var kat = $('fKat').value, brk = $('fBrk').checked;
  var kats = ELIM.kategori.filter(function(k){ return k.punyaBracket && (!kat || k.kategori === kat); });
  if (!kats.length) return '<div class="page"><p>Belum ada bracket eliminasi.</p></div>';
  var urut = function(m){ return m.ukuran === 1 ? 1.5 : m.ukuran; };
  var body = kats.map(function(k, gi){
    var ms = ELIM.matches.filter(function(m){ return m.kategori === k.kategori; });
    var set = k.sistem !== 'KUMULATIF';
    var rows = peringkatElim(ms).map(function(p){
      return '<tr><td class="t">' + (p.rank || '–') + '</td><td class="l">' + esc(p.o.nama) + '</td><td class="l">' + esc(p.o.klub) + '</td></tr>';
    }).join('');
    var main = ms.filter(function(m){ return m.a && m.b; }).sort(function(x, y){ return urut(y) - urut(x) || x.no - y.no; });
    var mrows = main.map(function(m){
      var ada = (m.skorA && m.skorA.length) || (m.skorB && m.skorB.length);
      var so = (m.soA !== '' && m.soA != null && m.soB !== '' && m.soB != null) ? 'SO ' + esc(m.soA) + '–' + esc(m.soB) + (m.soCloser ? '*' : '') : '';
      var bA = m.pemenang === 'A' ? 'font-weight:800' : '', bB = m.pemenang === 'B' ? 'font-weight:800' : '';
      return '<tr><td class="l">' + esc(m.babak === 'Perunggu' ? 'Perebutan Juara 3' : m.babak) + '</td>' +
        '<td class="l" style="' + bA + '">(' + esc(m.a.seed) + ') ' + esc(m.a.nama) + '</td>' +
        '<td class="t">' + (ada ? esc(m.poinA) + ' – ' + esc(m.poinB) : (m.pemenang ? '' : 'belum')) + '</td>' +
        '<td class="l" style="' + bB + '">(' + esc(m.b.seed) + ') ' + esc(m.b.nama) + '</td><td>' + so + '</td></tr>';
    }).join('');
    return '<section class="rpage' + (brk && gi > 0 ? ' brk' : '') + '">' +
      '<div class="rh"><div><div class="ev">' + esc(ELIM.namaLomba) + '</div><div class="sub">Hasil Eliminasi · dicetak ' + waktuCetak() + '</div></div>' +
      '<div class="kat">Kategori<b>' + esc(k.kategori) + '</b></div></div>' +
      '<h3 style="margin:0 0 2mm;font-size:11pt">Peringkat akhir</h3>' +
      '<table class="rs"><thead><tr><th>#</th><th class="l">Nama</th><th class="l">Klub</th></tr></thead><tbody>' + rows + '</tbody></table>' +
      '<h3 style="margin:6mm 0 2mm;font-size:11pt">Hasil pertandingan</h3>' +
      '<table class="rs"><thead><tr><th class="l">Babak</th><th class="l">Pemanah A</th><th>' + (set ? 'Poin set' : 'Total') + '</th><th class="l">Pemanah B</th><th>Shoot-off</th></tr></thead><tbody>' +
      (mrows || '<tr><td colspan="5">Belum ada pertandingan.</td></tr>') + '</tbody></table>' +
      '<div class="rnote">' + (set ? 'Sistem set: menang set = 2 poin, seri = 1 poin, pertama mencapai 6 poin menang.' : 'Sistem kumulatif: total 5 rambahan × 3 anak panah.') +
      ' Angka dalam kurung = seed kualifikasi. Pemenang dicetak tebal.' + (mrows.indexOf('*') >= 0 ? ' * = ditentukan anak panah paling dekat ke tengah.' : '') + '</div>' +
    '</section>';
  }).join('');
  return '<div class="page">' + body + '</div>';
}

function render(){
  if (!KARTU) return;
  var k = MODE === 'kartu';
  var es = MODE === 'ess'; if (es) isiBabak(); $('lBabak').hidden = !es;
  var h = MODE === 'hasil'; $('lBant').hidden = !k; $('lGel').hidden = !(k || h) || $('fGel').options.length < 2; $('lSesi').hidden = !(k || h); $('lKosong').hidden = !(k || es); $('lBrk').hidden = k || es; $('lKat').hidden = k;
  document.body.classList.toggle('land', k);
  $('pg').textContent = k ? '@page{size:A4 landscape;margin:8mm}' : '@page{size:A4 portrait;margin:10mm}';
  $('out').innerHTML = MODE === 'kartu' ? renderKartu() : MODE === 'elim' ? renderElim() : es ? renderESS() : renderHasil();
  document.title = k ? 'Scoresheet' + ($('fBant').value ? ' Bantalan ' + $('fBant').value : '') + ($('fSesi').value ? ' Sesi ' + $('fSesi').value : '') + ' - ' + KARTU.namaLomba
                     : es ? 'Scoresheet Eliminasi' + ($('fBabak').value ? ' ' + $('fBabak').value : '') + ($('fKat').value ? ' - ' + $('fKat').value : '') + ' - ' + KARTU.namaLomba : (MODE === 'elim' ? 'Hasil Eliminasi' : 'Hasil Kualifikasi' + ($('fSesi').value ? ' Sesi ' + $('fSesi').value : '') + ($('fGel').value ? ' ' + $('fGel').value : '')) + ($('fKat').value ? ' - ' + $('fKat').value : '') + ' - ' + KARTU.namaLomba;
}

$('mode').onclick = function(e){
  var b = e.target.closest('button'); if (!b) return;
  MODE = b.dataset.m;
  Array.prototype.forEach.call(this.children, function(x){ x.classList.toggle('on', x === b); });
  if (KARTU) isiFilter();
  render();
};
['fKat','fGel','fBant','fSesi','fKosong','fBrk','fBabak'].forEach(function(id){ $(id).onchange = render; });
$('btnMuat').onclick = muat;
$('btnCetak').onclick = function(){ window.print(); };
var qm = new URLSearchParams(location.search).get('mode');
if (qm === 'hasil') $('mode').children[1].click();
if (qm === 'ess') $('mode').children[2].click();
if (qm === 'elim') $('mode').children[3].click();
AdminAuth.gate(apiUrl(), function(){ muat(); }, 'Cetak Scoresheet & Hasil');
</script>
